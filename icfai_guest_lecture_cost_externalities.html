<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restricted Academic Access | Microeconomics of Cost & Systemic Externalities</title>
  <meta name="description" content="Protected doctoral and MBA research laboratory: The Microeconomics of Cost, Systemic Externalities & Evolutionary Mechanics." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- KaTeX Publication-Grade Equation Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/copy-tex.min.js" crossorigin="anonymous"></script>

  <style>

    /* ==========================================================================
       CSS Design System: Tokens, Typography, and Layout
       ========================================================================== */
    :root {
      --primary: #1F4E79;
      --primary-dark: #0F2942;
      --primary-light: #2F5597;
      --primary-subtle: #EBF3FA;
      --primary-border: #BFDBFE;
      
      --accent-red: #C00000;
      --accent-red-subtle: #FDE8E8;
      --accent-coral: #E26B57;
      --accent-green: #198038;
      --accent-green-subtle: #DEF8E9;
      --accent-amber: #D97706;
      --accent-amber-subtle: #FEF3C7;
      --accent-purple: #7C3AED;
      --accent-purple-subtle: #F3E8FF;
      
      --bg-body: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-surface-raised: #FFFFFF;
      --bg-surface-alt: #F1F5F9;
      --bg-canvas: #F8FAFC;
      --bg-subtle: #F1F5F9;
      --bg-muted: #E2E8F0;
      
      --text-main: #0F172A;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #475569;
      --text-subtle: #64748B;
      --border-color: #E2E8F0;
      --border-subtle: #E2E8F0;
      --border-strong: #CBD5E1;
      --border-focus: #3B82F6;
      
      --danger: #DC2626;
      --danger-light: #FEF2F2;
      --danger-border: #FECACA;
      --success: #15803D;
      --success-light: #F0FDF4;
      --success-border: #BBF7D0;
      --purple: #6D28D9;
      --purple-light: #FAF5FF;
      --purple-border: #E9D5FF;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 22px;
      --radius-full: 9999px;
      
      --font-sans: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-serif: 'Lora', Georgia, serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      --font-display: 'Cinzel', serif;
      
      --transition-base: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --header-height: 64px;
      --sidebar-width: 290px;
    }

    [data-theme="dark"] {
      --bg-body: #090D16;
      --bg-canvas: #090D16;
      --bg-surface: #111827;
      --bg-surface-raised: #1A2234;
      --bg-surface-alt: #1E293B;
      --bg-subtle: #1E293B;
      --bg-muted: #334155;
      
      --text-main: #F8FAFC;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --text-subtle: #64748B;
      --border-color: #334155;
      --border-subtle: #1E293B;
      --border-strong: #334155;
      
      --primary: #3B82F6;
      --primary-light: #60A5FA;
      --primary-subtle: #1E293B;
      --primary-border: rgba(59, 130, 246, 0.3);
      
      --accent-red: #EF4444;
      --accent-red-subtle: #371B1B;
      --accent-green: #22C55E;
      --accent-green-subtle: #132E1F;
      --accent-amber: #F59E0B;
      --accent-amber-subtle: #33230C;
      --accent-purple: #A855F7;
      --accent-purple-subtle: #291B3D;
      
      --danger: #EF4444;
      --danger-light: rgba(239, 68, 68, 0.15);
      --danger-border: rgba(239, 68, 68, 0.3);
      --success: #22C55E;
      --success-light: rgba(34, 197, 94, 0.15);
      --success-border: rgba(34, 197, 94, 0.3);
      --purple: #A855F7;
      --purple-light: rgba(168, 85, 247, 0.15);
      --purple-border: rgba(168, 85, 247, 0.3);

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      font-family: var(--font-sans);
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }

    /* Reading Progress Bar */
    #reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, #1F4E79, #3B82F6, #7C3AED, #C00000);
      z-index: 1200;
      transition: width 0.1s ease;
    }

    /* ==========================================================================
       Top App Header & Navigation
       ========================================================================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      transition: var(--transition-base);
    }
    [data-theme="dark"] .app-header {
      background: rgba(17, 24, 39, 0.94);
    }

    .header-inner {
      max-width: 1520px;
      margin: 0 auto;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-badge {
      background: linear-gradient(135deg, #1F4E79, #2F5597);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 8px rgba(31, 78, 121, 0.25);
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-subtitle {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mode-switch {
      display: inline-flex;
      background: var(--bg-surface-alt);
      padding: 3px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .mode-btn {
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: var(--transition-base);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-btn.active {
      background: var(--bg-surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    [data-theme="dark"] .mode-btn.active {
      color: #60A5FA;
    }

    .action-btn {
      padding: 6px 13px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: var(--transition-base);
    }
    .action-btn:hover {
      background: var(--bg-surface-alt);
      border-color: var(--text-muted);
    }
    .action-btn.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .action-btn.primary:hover {
      background: var(--primary-dark);
    }

    /* ==========================================================================
       Layout Containers
       ========================================================================== */
    .app-main {
      max-width: 1520px;
      margin: 0 auto;
      padding: 20px 24px 60px;
    }

    /* Deck View Mode */
    .deck-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .deck-viewport {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      min-height: 640px;
      position: relative;
    }

    .deck-slide {
      display: none;
      padding: 36px 44px;
      animation: fadeIn 0.3s ease forwards;
    }

    .deck-slide.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-category {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary);
      margin-bottom: 6px;
      display: inline-block;
    }
    [data-theme="dark"] .slide-category {
      color: #60A5FA;
    }

    .slide-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .lead-text {
      font-size: 1.02rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 16px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 16px;
    }

    @media (max-width: 1024px) {
      .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .deck-slide { padding: 24px 20px; }
      .math-steps-grid { grid-template-columns: 1fr; }
    }

    .concept-card {
      background: var(--bg-surface-alt);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      transition: var(--transition-base);
    }
    .concept-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .concept-card.highlight {
      border-left: 4px solid var(--primary);
    }
    .concept-card.danger {
      border-left: 4px solid var(--accent-red);
      background: var(--accent-red-subtle);
    }
    .concept-card.warning {
      border-left: 4px solid var(--accent-amber);
      background: var(--accent-amber-subtle);
    }
    .concept-card.success {
      border-left: 4px solid var(--accent-green);
      background: var(--accent-green-subtle);
    }

    .concept-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .concept-desc {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .callout {
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-top: 16px;
      font-size: 0.88rem;
      line-height: 1.6;
      border-left: 4px solid var(--primary);
      background: var(--primary-subtle);
    }
    .callout.alert {
      border-left-color: var(--accent-red);
      background: var(--accent-red-subtle);
      color: #7F1D1D;
    }
    [data-theme="dark"] .callout.alert { color: #FCA5A5; }
    .callout.tip {
      border-left-color: var(--accent-green);
      background: var(--accent-green-subtle);
      color: #14532D;
    }
    [data-theme="dark"] .callout.tip { color: #86EFAC; }
    .callout.warning {
      border-left-color: var(--accent-amber);
      background: var(--accent-amber-subtle);
      color: #78350F;
    }
    [data-theme="dark"] .callout.warning { color: #FCD34D; }

    .callout-title {
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Math Step Cards */
    .math-block {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 20px;
      margin: 14px 0;
      overflow-x: auto;
      box-shadow: var(--shadow-sm);
    }

    .math-steps-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .math-step-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      overflow: hidden;
    }
    .math-step-card.danger { border-top: 3px solid var(--accent-red); }
    .math-step-card.success { border-top: 3px solid var(--accent-green); }
    .math-step-card.warning { border-top: 3px solid var(--accent-amber); }
    .math-step-card.highlight { border-top: 3px solid var(--primary); }

    .math-step-header {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-subtle);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .math-step-body {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .math-step-body .katex-display {
      margin: 0.25em 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    /* Tables */
    .data-table-container {
      overflow-x: auto;
      margin: 16px 0;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .custom-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
      text-align: left;
    }
    .custom-table th {
      background: var(--bg-surface-alt);
      padding: 10px 14px;
      font-weight: 700;
      color: var(--text-main);
      border-bottom: 2px solid var(--border-color);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .custom-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-secondary);
    }
    .custom-table tr:last-child td {
      border-bottom: none;
    }
    .custom-table tr:hover td {
      background: var(--bg-surface-alt);
    }

    /* Deck Controls Bar */
    .deck-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .slide-counter {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .deck-nav-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .deck-btn {
      padding: 7px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      cursor: pointer;
      transition: var(--transition-base);
    }
    .deck-btn:hover {
      background: var(--bg-surface-alt);
      border-color: var(--primary);
      color: var(--primary);
    }
    .deck-btn.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .deck-btn.primary:hover {
      background: var(--primary-dark);
    }

    /* Speaker Notes Drawer */
    .notes-drawer {
      background: var(--bg-surface-alt);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      font-size: 0.84rem;
      color: var(--text-secondary);
      display: none;
    }
    .notes-drawer.open {
      display: block;
    }

    /* ==========================================================================
       Document View Mode (Continuous Academic Reading)
       ========================================================================== */
    .doc-container {
      display: none;
      gap: 32px;
      align-items: flex-start;
    }

    .doc-container.active {
      display: flex;
    }

    .doc-sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      position: sticky;
      top: calc(var(--header-height) + 16px);
      max-height: calc(100vh - var(--header-height) - 32px);
      overflow-y: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .doc-sidebar::-webkit-scrollbar {
      width: 4px;
    }
    .doc-sidebar::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 4px;
    }

    .doc-toc-title {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .doc-toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .doc-toc-item a {
      display: flex;
      align-items: center;
      padding: 5px 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: var(--radius-sm);
      border-left: 2px solid transparent;
      transition: var(--transition-base);
      line-height: 1.35;
    }
    .doc-toc-item a:hover {
      color: var(--primary);
      background: var(--bg-surface-alt);
    }
    .doc-toc-item a.active {
      color: var(--primary);
      background: var(--primary-subtle);
      border-left-color: var(--primary);
      font-weight: 700;
    }
    .doc-toc-item.nested a {
      padding-left: 18px;
      font-size: 0.76rem;
    }

    .doc-content {
      flex: 1;
      min-width: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px 48px;
      box-shadow: var(--shadow-md);
    }

    @media (max-width: 960px) {
      .doc-container { flex-direction: column; }
      .doc-sidebar { width: 100%; position: static; max-height: none; }
      .doc-content { padding: 24px 20px; }
    }

    /* Paper Hero Card */
    .paper-hero-card {
      background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-subtle) 100%);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      margin-bottom: 2.5rem;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }
    .paper-hero-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #1F4E79, #3B82F6, #D97706, #C00000);
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-bottom: 1rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-primary { background: var(--primary-subtle); color: var(--primary); border: 1px solid var(--primary-border); }
    .badge-danger { background: var(--danger-light); color: var(--danger); border: 1px solid var(--danger-border); }

  <!-- Web Crypto Decryption Engine -->
  <script>
    const SESSION_KEY = 'ICFAI_LECTURE_ACCESS_DECRYPTED';
    let cachedPassword = null;

    function base64ToBytes(base64) {
      const binaryString = atob(base64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes;
    }

    async function decryptPackage(password, pkg) {
      const enc = new TextEncoder();
      const passwordBuffer = enc.encode(password.trim().toUpperCase());
      const saltBytes = base64ToBytes(pkg.salt);
      const ivBytes = base64ToBytes(pkg.iv);
      const dataBytes = base64ToBytes(pkg.data);

      const keyMaterial = await window.crypto.subtle.importKey(
        "raw",
        passwordBuffer,
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );

      const derivedKey = await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltBytes,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const decryptedBuffer = await window.crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: ivBytes
        },
        derivedKey,
        dataBytes
      );

      const dec = new TextDecoder();
      return dec.decode(decryptedBuffer);
    }

    function setHtmlAndExecuteScripts(container, html) {
      container.innerHTML = html;
      const scripts = container.querySelectorAll("script");
      scripts.forEach(oldScript => {
        const newScript = document.createElement("script");
        Array.from(oldScript.attributes).forEach(attr => {
          newScript.setAttribute(attr.name, attr.value);
        });
        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });
    }

    async function handlePasswordSubmit(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('lecture-password-input');
      const errBox = document.getElementById('portal-error-msg');
      const submitBtn = document.getElementById('portal-submit-btn');
      const entered = input.value.trim().toUpperCase();

      if (!entered) {
        showPortalError("Please enter the institutional access code.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>⏳</span> Decrypting...';
      if (errBox) errBox.style.display = 'none';

      try {
        const pkgText = document.getElementById('encrypted-payload').textContent;
        const pkg = JSON.parse(pkgText);
        const decryptedHtml = await decryptPackage(entered, pkg);

        // Success!
        sessionStorage.setItem(SESSION_KEY, entered);
        cachedPassword = entered;

        const portal = document.getElementById('password-portal');
        portal.classList.add('unlocked');
        setTimeout(() => { portal.style.display = 'none'; }, 400);

        const root = document.getElementById('app-root');
        setHtmlAndExecuteScripts(root, decryptedHtml);

      } catch (err) {
        console.error("Decryption failed:", err);
        input.classList.add('error');
        input.value = '';
        input.focus();
        showPortalError("❌ Incorrect Access Code. Authentication failed.");
        setTimeout(() => {
          input.classList.remove('error');
        }, 600);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>🔓</span> Decrypt &amp; Launch Lab';
      }
    }

    function showPortalError(msg) {
      const errBox = document.getElementById('portal-error-msg');
      if (errBox) {
        errBox.innerText = msg;
        errBox.style.display = 'block';
      }
    }

    function relockLecture() {
      sessionStorage.removeItem(SESSION_KEY);
      cachedPassword = null;
      const root = document.getElementById('app-root');
      if (root) root.innerHTML = '';
      const portal = document.getElementById('password-portal');
      if (portal) {
        portal.style.display = 'flex';
        portal.classList.remove('unlocked');
        const input = document.getElementById('lecture-password-input');
        if (input) {
          input.value = '';
          setTimeout(() => input.focus(), 100);
        }
      }
    }

    // Auto-unlock if session key exists
    window.addEventListener('DOMContentLoaded', async () => {
      const savedPass = sessionStorage.getItem(SESSION_KEY);
      if (savedPass) {
        try {
          const pkgText = document.getElementById('encrypted-payload').textContent;
          const pkg = JSON.parse(pkgText);
          const decryptedHtml = await decryptPackage(savedPass, pkg);

          const portal = document.getElementById('password-portal');
          portal.classList.add('unlocked');
          portal.style.display = 'none';

          const root = document.getElementById('app-root');
          setHtmlAndExecuteScripts(root, decryptedHtml);
          return;
        } catch (e) {
          sessionStorage.removeItem(SESSION_KEY);
        }
      }
      
      const input = document.getElementById('lecture-password-input');
      if (input) setTimeout(() => input.focus(), 100);
    });
  </script>
