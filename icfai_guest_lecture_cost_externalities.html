  <script>
    function b64ToBytes(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    async function decrypt(password, pkg) {
      const enc = new TextEncoder();
      const pwBuf = enc.encode(password.trim().toUpperCase());
      const salt = b64ToBytes(pkg.salt);
      const iv   = b64ToBytes(pkg.iv);
      const data = b64ToBytes(pkg.data);

      const keyMat = await crypto.subtle.importKey("raw", pwBuf, "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        keyMat,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const decBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
      return new TextDecoder().decode(decBuf);
    }

    async function handlePasswordSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('lecture-password-input');
      const errBox = document.getElementById('portal-error-msg');
      const btn = document.getElementById('portal-submit-btn');
      const pw = input.value.trim().toUpperCase();

      if (!pw) {
        errBox.innerText = "Please enter the access code.";
        errBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span> Decrypting...';
      errBox.style.display = 'none';

      try {
        const pkg = JSON.parse(document.getElementById('encrypted-payload').textContent);
        const html = await decrypt(pw, pkg);

        // Replace the entire page with the decrypted original HTML.
        // This ensures ALL scripts, event listeners, and frameworks
        // execute exactly as they would on a normal page load.
        document.open();
        document.write(html);
        document.close();

      } catch (err) {
        console.error("Decryption failed:", err);
        input.classList.add('error');
        input.value = '';
        input.focus();
        errBox.innerText = "❌ Incorrect Access Code.";
        errBox.style.display = 'block';
        setTimeout(() => input.classList.remove('error'), 500);
        btn.disabled = false;
        btn.innerHTML = '<span>🔓</span> Unlock &amp; Launch';
      }
    }

    // Auto-focus the input
    window.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('lecture-password-input');
      if (input) setTimeout(() => input.focus(), 100);
    });
  </script>
